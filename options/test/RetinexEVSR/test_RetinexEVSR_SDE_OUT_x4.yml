name: RetinexEVSR_SDE_Outdoor_BIx4
model_type: EvLowLightVSR_Model
scale: 4
num_gpu: auto  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test:
    name: SDE_OUT_Test
    type: EvLowLightVSR_TestDataset
    dataroot_gt: datasets/SDE/SDE_OUT/GT/test
    dataroot_lq: datasets/SDE/SDE_OUT/LowLightLRx4/test
    meta_info_file: basicsr/data/meta_info/meta_info_sde_outdoor_test.txt
    io_backend:
      type: hdf5
    pad_scale: 8 # pad the image so that it is divisible by pad_scale

# network structures
network_g:
  type: RetinexEVSR
  dim: 32
  num_blocks: 5

# path
path:
  pretrain_network_g: experiments/pretrained_models/RetinexEVSR/RetinexEVSR_SDE_Outdoor_BIx4.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
